<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Maqueta · tarjeta OG</title>
    <style>
      :root {
        --ink: #16171b;
        --ink-soft: #55575e;
        --bg: #f6f6f4;
        --accent: #3b53d6;
        --line: #e0e0dc;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 400 20px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        gap: 64px;
        padding: 84px 88px;
      }

      .col {
        flex: 1 1 auto;
        max-width: 720px;
      }

      .wordmark {
        display: flex;
        align-items: center;
        gap: 14px;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: -0.02em;
      }
      .wordmark svg { width: 40px; height: 40px; display: block; }

      h1 {
        margin-top: 44px;
        font-size: 68px;
        line-height: 1.06;
        letter-spacing: -0.035em;
        font-weight: 700;
      }

      .sub {
        margin-top: 30px;
        font-size: 25px;
        color: var(--ink-soft);
        max-width: 30ch;
      }

      .foot {
        margin-top: 52px;
        font-size: 19px;
        color: var(--ink-soft);
      }
      .foot b { color: var(--accent); font-weight: 600; }

      /* Marca grande a la derecha: eco del favicon. */
      .mark {
        flex: 0 0 auto;
        width: 300px;
        height: 380px;
      }
      .mark svg { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div class="col">
      <div class="wordmark">
        <svg viewBox="0 0 32 32">
          <rect width="32" height="32" rx="7" fill="#3b53d6" />
          <rect x="7" y="6.5" width="18" height="19" rx="2.5" fill="none" stroke="#fff" stroke-width="2" />
          <rect x="10" y="9.5" width="12" height="4" rx="1" fill="#fff" />
          <rect x="10" y="16" width="5.5" height="6.5" rx="1" fill="#fff" />
          <rect x="17.5" y="16" width="4.5" height="6.5" rx="1" fill="#fff" opacity="0.5" />
        </svg>
        <span>Maqueta</span>
      </div>

      <h1>Diseña tu web tú mismo. Yo la construyo.</h1>
      <p class="sub">Eliges el diseño en un configurador visual y lo ves en vivo.</p>
      <p class="foot">Gratis y sin registro · <b>Presupuesto sin compromiso</b></p>
    </div>

    <div class="mark">
      <svg viewBox="0 0 120 152">
        <rect x="2" y="2" width="116" height="148" rx="12" fill="none" stroke="#3b53d6" stroke-width="3" />
        <rect x="16" y="18" width="88" height="26" rx="5" fill="#3b53d6" />
        <rect x="16" y="56" width="40" height="80" rx="5" fill="#3b53d6" />
        <rect x="64" y="56" width="40" height="80" rx="5" fill="#3b53d6" opacity="0.28" />
      </svg>
    </div>
  </body>
</html>
